# nginx-конфиг для E2E-джобы в GitLab CI (ci/e2e-nginx.conf).
#
# Повторяет продакшен-схему из frontend/nginx.conf (nginx впереди, Next внутри),
# с поправками под джобу:
#   * listen 3080 — Playwright ожидает фронтенд на http://localhost:3080;
#   * бэкенд доступен по 127.0.0.1:8000 (процесс uvicorn в той же джобе),
#     а не по docker-хосту backend:8000, поэтому resolver не нужен;
#   * standalone Next слушает 127.0.0.1:3000 (внутри, за nginx).
#
# Ключевое: /api и /ws проксируются на бэкенд с сохранением оригинального Host
# ($http_host/$host). Если этого не делать, редиректы бэкенда (redirect_slashes)
# будут указывать на http://localhost:8000/..., браузер уйдёт на :8000 напрямую,
# где у него нет csrf_token cookie, и мутации упадут с 403 "CSRF token missing".
# В docker-стеке эту роль выполняет тот же frontend/nginx.conf.

server {
    listen 3080;

    # ── /api → FastAPI-бэкенд (с сохранением Host клиента) ──────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── /ws → WebSocket на бэкенд ────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── всё остальное → standalone Next.js ───────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

# Логи и pid — в /tmp, чтобы не зависеть от прав на каталоги образа.
error_log /tmp/nginx-error.log;
pid /tmp/nginx.pid;
