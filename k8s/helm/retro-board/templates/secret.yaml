{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "retro-board.fullname" . }}-secrets
  labels:
    {{- include "retro-board.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  ADMIN_LOGIN: {{ .Values.secrets.adminLogin | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  WORKSPACE_JWT_SECRET: {{ .Values.secrets.workspaceJwtSecret | quote }}
  ADMIN_JWT_SECRET: {{ .Values.secrets.adminJwtSecret | quote }}
  {{- if .Values.secrets.aiApiKey }}
  AI_API_KEY: {{ .Values.secrets.aiApiKey | quote }}
  {{- end }}
{{- end }}
