name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic heads --verbose
      - run: pytest -v
        env:
          DATABASE_URL: "sqlite://"

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps
      - name: Start stack
        run: docker compose up --build -d
        env:
          POSTGRES_DB: retro
          POSTGRES_USER: retro
          POSTGRES_PASSWORD: retro
          TESTING: "true"
          WORKSPACE_JWT_SECRET: "test-workspace-jwt-secret-at-least-32-chars"
          ADMIN_JWT_SECRET: "test-admin-jwt-secret-at-least-32-chars"
          ADMIN_LOGIN: "testadmin"
          ADMIN_PASSWORD: "testpassword123"
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health; then
              echo " Backend ready"
              break
            fi
            echo "Waiting for backend... ($i)"
            sleep 2
          done
      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3080; then
              echo " Frontend ready"
              break
            fi
            echo "Waiting for frontend... ($i)"
            sleep 2
          done
      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test
        env:
          ADMIN_LOGIN: "testadmin"
          ADMIN_PASSWORD: "testpassword123"
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs backend --tail=100
      - name: Stop stack
        if: always()
        run: docker compose down -v
