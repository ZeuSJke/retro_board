проверка-образа:
  image: registry.kirillbessonov.ru/tools/ci-base:2026-08-20
  script:
    - node --version && pnpm --version && uv --version
    - pandoc --version | head -1
    - helm version --short && kubeconform -v
    - buildctl debug workers
    - echo "$UV_CACHE_DIR / $pnpm_config_store_dir"
    - ls -la /cache/uv /cache/pnpm