# ─────────────────────────────────────────────────────────────────────────────
# RetroBoard — CI на self-hosted GitLab (gitlab.kirillbessonov.ru, fmrm/retro_board)
#
# Перенесено с GitHub Actions (.github/workflows/ci.yml удалён).
# Соответствия: runs-on → tags: [homelab]; actions/checkout не нужен — GitLab
# сам клонирует репозиторий; all uses: actions/* → обычные shell-команды.
# ─────────────────────────────────────────────────────────────────────────────

# Базовый образ CI_BASE_IMAGE задаётся на уровне инстанса GitLab (см. homelab/infrastructure).
# Образ уже содержит node 24, uv+Python 3.12, pandoc, helm, kubeconform (+ /opt/schemas),
# buildctl, kubectl, git, jq, curl — ничего в джобах не ставим.
variables:
  BUILDKIT_HOST: "unix:///run/buildkit/buildkitd.sock"
  STAGING_TAG: "staging-$CI_COMMIT_SHORT_SHA"
  STAGING_KUBE_CONTEXT: "fmrm/cluster-admins:k3s-stage"
  STAGING_NAMESPACE: "retro-board"

# Общие настройки всех джоб. Раннер на стенде один (инстанс), тег homelab.
default:
  image: $CI_BASE_IMAGE
  tags:
    - homelab
  before_script:
    - set -e
    - |
      [ -n "${CI_BASE_IMAGE:-}" ] || { echo "ERROR CI_BASE_IMAGE is not set (instance CI variable expected)" >&2; exit 1; }

# Триггеры пайплайна:
#   * schedule не запускает пайплайн;
#   * push в main прогоняет тесты, собирает образы и катит k3s-stage;
#   * merge request в main прогоняет тесты, helm-гейты и (при правках сборки) smoke-билд образов.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'

stages:
  - test
  - build
  - deploy

# ── Бэкенд: pytest на SQLite ─────────────────────────────────────────────────
backend-tests:
  stage: test
  variables:
    # Как в GitHub Actions (env на уровне job): conftest.py тоже задаёт эти
    # значения, но держим явно для паритета. Без DATABASE_URL Settings()
    # упадёт — поле обязательное, .env в CI нет.
    DATABASE_URL: sqlite://
    TESTING: "true"
  script:
    - cd backend
    # Python в базовом образе — управляемый uv (uv python install), поэтому
    # --system запрещён ("externally managed"). Каноничный путь — venv:
    #   uv venv → uv pip install → активируем venv и работаем из него.
    # Кэш по-прежнему работает: UV_CACHE_DIR=/cache/uv смонтирован с хоста.
    - uv venv
    - uv pip install --require-hashes -r requirements-dev.txt
    - . .venv/bin/activate
    # Проверка целостности цепочки миграций, синтаксиса entrypoint, ruff и mypy.
    - sh -n entrypoint.sh
    - alembic heads --verbose
    - ruff check .
    - mypy app main.py
    - pytest -v

# ── Бэкенд на PostgreSQL: миграции и тот же набор тестов ─────────────────────
# SQLite не воспроизводит блокировки, типы и длины строк PostgreSQL и не
# исполняет миграции. Здесь цепочка миграций проходит до нуля и обратно,
# `alembic check` сверяет модели со схемой, а pytest идёт на настоящей базе.
backend-tests-pg:
  stage: test
  services:
    - name: docker.io/library/postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
      alias: postgres
  variables:
    POSTGRES_DB: retro
    POSTGRES_USER: retro
    POSTGRES_PASSWORD: retro
    DATABASE_URL: postgresql://retro:retro@postgres:5432/retro
    TEST_DATABASE_URL: postgresql://retro:retro@postgres:5432/retro
    TESTING: "true"
  script:
    - cd backend
    - uv venv
    - uv pip install --require-hashes -r requirements-dev.txt
    - . .venv/bin/activate
    - |
      python - <<'PY'
      import socket, time
      for i in range(30):
          try:
              socket.create_connection(("postgres", 5432), timeout=2).close()
              print("Postgres is ready")
              break
          except OSError:
              time.sleep(2)
      else:
          raise SystemExit("Postgres is not reachable after 60s")
      PY
    # Миграция непустой БД (0014 -> 0015 с удалённой и живой доской одинакового имени)
    - alembic upgrade 0014
    - |
      python - <<'PY'
      import os
      from datetime import UTC, datetime
      from sqlalchemy import create_engine, text
      eng = create_engine(os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+psycopg://"))
      with eng.begin() as conn:
          ts = datetime.now(UTC)
          conn.execute(
              text("INSERT INTO workspaces (id, name, slug, access_key_hash, created_at) VALUES ('mig-ws', 'Mig WS', 'mig-ws', 'hash', :ts)"),
              {"ts": ts},
          )
          conn.execute(
              text("INSERT INTO boards (id, workspace_id, name, slug, max_votes, created_at, deleted_at) VALUES ('mig-del', 'mig-ws', 'Sprint 1', 'sprint-1', 5, :ts, :ts)"),
              {"ts": ts},
          )
      PY
    - alembic upgrade head
    - |
      python - <<'PY'
      import os
      from sqlalchemy import create_engine, text
      eng = create_engine(os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+psycopg://"))
      with eng.begin() as conn:
          conn.execute(text("INSERT INTO boards (id, workspace_id, name, slug, max_votes, created_at) VALUES ('mig-live', 'mig-ws', 'Sprint 1', 'sprint-1', 5, NOW())"))
      PY
    - alembic check
    - alembic downgrade base
    - alembic upgrade head
    - mypy app main.py
    - pytest -q

# ── Зависимости: известные уязвимости ────────────────────────────────────────
# Не блокирует пайплайн: джобе нужен доступ к базе уязвимостей PyPI и реестру npm,
# а новая запись в базе не должна останавливать не связанный с ней MR.
# Красная джоба — повод обновить пакет (backend: правка requirements.in + make lock).
deps-audit:
  stage: test
  allow_failure: true
  script:
    - uvx pip-audit --require-hashes --disable-pip -r backend/requirements.txt
    - cd frontend
    - npm audit --omit=dev

.frontend-job:
  stage: test
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  before_script:
    - set -e
    - '[ -n "${CI_BASE_IMAGE:-}" ] || { echo "ERROR CI_BASE_IMAGE is not set (instance CI variable expected)" >&2; exit 1; }'
    - cd frontend
    # Кэшируем node_modules по хэшу package-lock.json между запусками, иначе ставим из /cache/npm.
    - '[ -d node_modules ] && [ -f node_modules/.package-lock.json ] || npm ci --prefer-offline'

# ── Фронтенд: сборка + линт ──────────────────────────────────────────────────
frontend-lint:
  extends: .frontend-job
  script:
    - npm run build
    - npm run typecheck
    - npm run lint

# ── Фронтенд: юнит-тесты (Vitest) ────────────────────────────────────────────
frontend-tests:
  extends: .frontend-job
  script:
    - npm test

# ── E2E: Playwright против полного стека ─────────────────────────────────────
# В GitHub Actions E2E поднимал стек через docker compose up --build, но на этом
# стенде Docker-демона нет и не будет (docker build/run/compose/dind запрещены).
# Поэтому стек разворачиваем без Docker, повторяя схему проксирования из
# ci/e2e-nginx.conf: standalone Next.js на 3000 + nginx на 3080:
#   * PostgreSQL — как GitLab CI service (штатная фича docker executor'а
#     раннера, а не docker:dind и не docker CLI; образ тянется через зеркало);
#   * бэкенд (uvicorn), standalone Next.js и nginx — процессами в джобе.
# nginx здесь не роскошь, а необходимость: Next-rewrite проксирует /api с
# Host=localhost:8000, из-за чего редиректы бэкенда (redirect_slashes) утекают
# на :8000, браузер теряет csrf_token cookie и мутации падают с 403. nginx
# сохраняет Host клиента (см. ci/e2e-nginx.conf) — как в проде.
e2e-tests:
  stage: test
  services:
    # docker.io/library/... — подмена на зеркало dh-mirror.gitverse.ru происходит
    # на уровне машины (зеркалирование registry на стенде), а не у Zot — Zot снесён.
    - name: docker.io/library/postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
      alias: postgres
  variables:
    # POSTGRES_* уходят в сервисный контейнер PostgreSQL.
    POSTGRES_DB: retro
    POSTGRES_USER: retro
    POSTGRES_PASSWORD: retro
    # Сервис в сети джобы доступен по алиасу postgres.
    DATABASE_URL: postgresql://retro:retro@postgres:5432/retro
    TESTING: "true"
    CORS_ORIGINS: http://localhost:3080
    ADMIN_LOGIN: testadmin
    ADMIN_PASSWORD: testpassword123
    WORKSPACE_JWT_SECRET: test-workspace-jwt-secret-at-least-32-chars
    ADMIN_JWT_SECRET: test-admin-jwt-secret-at-least-32-chars
    # Бэкенд слушает 8000; nginx (3080) проксирует /api на него.
    BACKEND_URL: http://localhost:8000
    # Образ задаёт PLAYWRIGHT_BROWSERS_PATH=/cache/playwright, но дублируем её
    # в джобе: каталог смонтирован раннером с хоста, и браузер должен лежать
    # именно там, чтобы переживать джобы (а не в /root/.cache контейнера).
    PLAYWRIGHT_BROWSERS_PATH: /cache/playwright
    # Браузер должен работать в UTF-8-локали, как у пользователей: в локали C
    # Chromium заменяет кириллическое имя скачиваемого файла на «download».
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
  script:
    - cd backend
    # То же, что в backend-tests: Python в образе управляется uv, ставим в venv.
    - uv venv
    - uv pip install --require-hashes -r requirements-dev.txt
    - . .venv/bin/activate
    # Ждём, пока сервис PostgreSQL примет соединения. pg_isready есть только
    # внутри postgres-контейнера, в образе джобы его нет — ждём по TCP.
    - |
      python - <<'PY'
      import socket, time
      for i in range(30):
          try:
              socket.create_connection(("postgres", 5432), timeout=2).close()
              print("Postgres is ready")
              break
          except OSError:
              time.sleep(2)
      else:
          raise SystemExit("Postgres is not reachable after 60s")
      PY
    # Миграции — то же, что делает entrypoint.sh в Docker-образе бэкенда.
    - alembic upgrade head
    # Бэкенд в фоне; те же proxy/ws флаги, что в backend/entrypoint.sh.
    - uvicorn main:app --host 0.0.0.0 --port 8000 --ws websockets-sansio --ws-max-size 65536 --proxy-headers --forwarded-allow-ips "*" > /tmp/backend.log 2>&1 &
    - cd ../frontend
    - npm ci
    - npm run build
    # Фронтенд собирается с output: standalone — в проде (frontend/Dockerfile)
    # сервер запускается как node .next/standalone/server.js, а статика лежит
    # в .next/standalone/.next/static. Запускаем его на 3000 за nginx.
    - cp -r .next/static .next/standalone/.next/static
    - PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/frontend.log 2>&1 &
    - cd ..
    # nginx на 3080 — единственная точка входа для браузера (как в проде).
    # Конфиг в репозитории: ci/e2e-nginx.conf.
    - nginx -t -c "$CI_PROJECT_DIR/ci/e2e-nginx.conf"
    - nginx -c "$CI_PROJECT_DIR/ci/e2e-nginx.conf" -g 'daemon off;' > /tmp/nginx.log 2>&1 &
    # Ждём готовности фронтенда и бэкенда — как wait-циклы в GitHub Actions.
    # Бэкенд проверяем через nginx (http://localhost:3080/api/health) — заодно
    # проверяется вся прокси-цепочка, а не только сам процесс uvicorn.
    - |
      for i in $(seq 1 30); do
        if curl -sf http://localhost:3080 >/dev/null; then echo "Frontend ready"; break; fi
        sleep 2
      done
      curl -sf http://localhost:3080 >/dev/null || { echo "Frontend did not start"; tail -n 50 /tmp/frontend.log; tail -n 50 /tmp/nginx.log; exit 1; }
    - |
      for i in $(seq 1 30); do
        if curl -sf http://localhost:3080/api/health >/dev/null; then echo "Backend ready"; break; fi
        sleep 2
      done
      curl -sf http://localhost:3080/api/health >/dev/null || { echo "Backend did not start"; tail -n 100 /tmp/backend.log; exit 1; }
    - cd frontend
    # Браузеры в образ не вшиты (версия должна совпадать с @playwright/test из
    # package.json, поэтому держим её вне образа). PLAYWRIGHT_BROWSERS_PATH
    # задан в образе и указывает на /cache/playwright — каталог смонтирован
    # раннером с хоста: первый прогон качает ~30 секунд, дальше берётся из кэша.
    # npx находит playwright локально в node_modules (после npm ci), в сеть не ходит.
    - npx playwright install chromium
    # Ретраев нет: slowapi выключен в тестовом окружении (TESTING=true,
    # см. backend/app/limiter.py), поэтому 429 от лимита 30/мин не возникает.
    - npx playwright test
  after_script:
    # Всегда показываем хвосты логов процессов — пригодится при отладке падений.
    - |
      if [ -f /tmp/backend.log ]; then echo "===== backend.log (tail) ====="; tail -n 100 /tmp/backend.log; fi
      if [ -f /tmp/frontend.log ]; then echo "===== frontend.log (tail) ====="; tail -n 100 /tmp/frontend.log; fi
      if [ -f /tmp/nginx.log ]; then echo "===== nginx.log (tail) ====="; tail -n 100 /tmp/nginx.log; fi
  artifacts:
    # Скриншоты/трейсы Playwright при падении — аналог actions/upload-artifact
    # с if: failure() и retention-days: 7 в GitHub Actions.
    when: on_failure
    expire_in: 7 days
    paths:
      - frontend/test-results/

# ── Helm: lint + kubeconform + render guard gates ────────────────────────────
helm:
  stage: test
  script:
    - helm lint k8s/helm/retro-board -f k8s/helm/retro-board/values-dev.yaml
    - helm lint k8s/helm/retro-board -f k8s/helm/retro-board/values-staging.yaml --set image.allowMutableTag=true
    - bash scripts/helm-render-checks.sh

# ── Общая заготовка для buildctl в CI ────────────────────────────────────────
.buildctl-login:
  before_script:
    - set -e
    - |
      [ -n "${CI_BASE_IMAGE:-}" ] || { echo "ERROR CI_BASE_IMAGE is not set" >&2; exit 1; }
      command -v buildctl >/dev/null || { echo "buildctl missing in CI_BASE_IMAGE" >&2; exit 1; }
      buildctl debug workers >/dev/null
      [ -n "${CI_REGISTRY:-}" ] && [ -n "${CI_REGISTRY_PASSWORD:-}" ] || {
        echo "ERROR: CI_REGISTRY / CI_REGISTRY_PASSWORD empty" >&2
        exit 1
      }
      AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      mkdir -p "$HOME/.docker"
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"

# ── MR smoke: сборка образов buildctl без пуша при правках Docker/deps ──────
image-smoke:
  stage: test
  extends: .buildctl-login
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/Dockerfile
        - backend/.dockerignore
        - backend/entrypoint.sh
        - backend/requirements.txt
        - backend/requirements.in
        - frontend/Dockerfile
        - frontend/.dockerignore
        - frontend/next.config.mjs
        - frontend/package.json
        - frontend/package-lock.json
        - scripts/build-image.sh
        - .gitlab-ci.yml
  script:
    - bash scripts/build-image.sh -t "$CI_REGISTRY_IMAGE/api:cache-ref" -f backend/Dockerfile backend
    - bash scripts/build-image.sh -t "$CI_REGISTRY_IMAGE/web:cache-ref" -f frontend/Dockerfile frontend

# ── Stage build: публикация образов на push в main ───────────────────────────
build-app-staging:
  stage: build
  extends: .buildctl-login
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - BUILD_EXPORT_CACHE=1 bash scripts/build-image.sh --push -t "$CI_REGISTRY_IMAGE/api:$STAGING_TAG" -t "$CI_REGISTRY_IMAGE/api:latest" -f backend/Dockerfile backend
    - BUILD_EXPORT_CACHE=1 bash scripts/build-image.sh --push -t "$CI_REGISTRY_IMAGE/web:$STAGING_TAG" -t "$CI_REGISTRY_IMAGE/web:latest" -f frontend/Dockerfile frontend

# ── Stage deploy: выкат на k3s-stage через shared-агент fmrm/cluster-admins ──
deploy-staging:
  stage: deploy
  resource_group: k3s-stage-retro-board
  needs:
    - build-app-staging
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - kubectl config use-context "$STAGING_KUBE_CONTEXT"
    - |
      vers=$(uv run --no-project --python 3.12 python - <<'PY'
      import json, subprocess
      data = json.loads(subprocess.check_output(["kubectl", "version", "-o", "json"]))
      c, s = data["clientVersion"], data["serverVersion"]
      print(c["major"], c["minor"], s["major"], s["minor"])
      PY
      )
      set -- $vers
      C_MAJ=${1//[!0-9]/}; C_MIN=${2//[!0-9]/}; S_MAJ=${3//[!0-9]/}; S_MIN=${4//[!0-9]/}
      SKEW=$(( C_MIN - S_MIN ))
      [ "$SKEW" -lt 0 ] && SKEW=$(( -SKEW ))
      if [ "$C_MAJ" != "$S_MAJ" ] || [ "$SKEW" -gt 1 ]; then
        echo "ERROR: kubectl $C_MAJ.$C_MIN vs cluster $S_MAJ.$S_MIN skew > 1 minor" >&2
        exit 1
      fi
      SCH="${K8S_SCHEMA_VERSION#v}"
      SCH_MAJ="${SCH%%.*}"
      SCH_REST="${SCH#*.}"
      SCH_MIN="${SCH_REST%%.*}"
      if [ -z "${K8S_SCHEMA_VERSION:-}" ] || [ "$SCH_MAJ" != "$S_MAJ" ] || [ "$SCH_MIN" != "$S_MIN" ]; then
        echo "ERROR: K8S_SCHEMA_VERSION (${K8S_SCHEMA_VERSION:-empty}) does not match cluster $S_MAJ.$S_MIN" >&2
        exit 1
      fi
    - kubectl create namespace "$STAGING_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - |
      if ! kubectl -n "$STAGING_NAMESPACE" get secret registry-pull >/dev/null 2>&1; then
        kubectl -n stratum get secret registry-pull -o json \
          | uv run --no-project --python 3.12 python -c 'import json,sys; s=json.load(sys.stdin); s["metadata"]={"name":"registry-pull","namespace":sys.argv[1]}; json.dump(s,sys.stdout)' "$STAGING_NAMESPACE" \
          | kubectl apply -f -
      fi
    - |
      kubectl -n "$STAGING_NAMESPACE" get secret retro-board-secrets >/dev/null 2>&1 || {
        echo "ERROR: Secret retro-board-secrets not found in namespace $STAGING_NAMESPACE. Create it before deploying." >&2
        exit 1
      }
    - |
      helm upgrade --install retro-board k8s/helm/retro-board \
        --namespace "$STAGING_NAMESPACE" \
        -f k8s/helm/retro-board/values-staging.yaml \
        --set-string image.tag="$STAGING_TAG" \
        --wait --timeout 10m
    - kubectl -n "$STAGING_NAMESPACE" rollout status statefulset/retro-board-postgres --timeout=5m
    - kubectl -n "$STAGING_NAMESPACE" rollout status deploy/retro-board-api --timeout=5m
    - kubectl -n "$STAGING_NAMESPACE" rollout status deploy/retro-board-web --timeout=5m
    - kubectl -n "$STAGING_NAMESPACE" get pods,svc,ingress
