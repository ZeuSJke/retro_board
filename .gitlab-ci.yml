проверка-связности:
  image: docker.io/library/debian:12
  script:
    - echo "раннер жив"
    - cat /etc/os-release | head -2
    - nproc
    - head -3 /proc/meminfo
    - id
    - echo "--- маппинг идентификаторов ---"
    - cat /proc/self/uid_map
    - ls -la /cache/pnpm /cache/uv
    - touch /cache/pnpm/.probe && echo "запись в кэш работает"